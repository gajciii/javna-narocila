# Coolify: Git repository / Docker Compose, Base Directory /,
# Compose Location /compose.coolify.yaml. Domain belongs to frontend, port 80.
# PostgreSQL, object storage and pipeline workers stay on it-server-pc.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-razpizi-coolify}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:?Set a Headscale preauth key in Coolify}
      TS_EXTRA_ARGS: --login-server=${TAILSCALE_LOGIN_SERVER:-https://vpn.viptronik.si}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-razpizi-coolify}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      # Forward incoming Docker traffic to this private tailnet machine,
      # preserving the destination port (PostgreSQL 55432 and S3 9002).
      TS_TAILNET_TARGET_IP: ${TAILSCALE_TARGET_IP:-100.64.0.7}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9003
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - tailscale-state:/var/lib/tailscale
    expose:
      - "55432"
      - "9002"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9003/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique signing key in Coolify}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the public HTTPS origin}
      HOSTED_REQUIRE_LOGIN: "1"
      DJANGO_TRUST_PROXY_SSL: "1"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      SESSION_COOKIE_SECURE: "1"
      DATABASE_URL: ${DATABASE_URL:?Set the private PostgreSQL URL}
      PIPELINE_REMOTE: "1"
      PIPELINE_S3_ENDPOINT: ${PIPELINE_S3_ENDPOINT:?Set the private S3 endpoint}
      PIPELINE_S3_BUCKET: ${PIPELINE_S3_BUCKET:-razpizi-documents}
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY:?Set the S3 access key}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY:?Set the S3 secret key}
      MEDIA_ROOT: /data/media
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn radar.wsgi:application --bind 0.0.0.0:8000
        --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    expose:
      - "8000"
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - web-media:/data/media
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONFIG: nginx.coolify.conf
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  web-media:
  tailscale-state:
