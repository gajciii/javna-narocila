# Coolify: Git repository / Docker Compose, Base Directory /,
# Compose Location /compose.coolify.yaml. Domain belongs to frontend, port 80.
# The whole stack (web, PostgreSQL, S3 storage, pipeline worker, scheduler) runs on
# the Coolify host. Every service has a memory limit: the host has no swap.
services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    command: [postgres, -c, shared_buffers=256MB, -c, effective_cache_size=768MB]
    environment:
      POSTGRES_DB: razpizi
      POSTGRES_USER: razpizi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the PostgreSQL password in Coolify}
    # Loopback only: reach it from a workstation with `ssh -L 55432:127.0.0.1:55432 server-1`.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U razpizi -d razpizi"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  storage:
    image: ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    restart: unless-stopped
    command: [--port, ":9000", posix, /data]
    environment:
      ROOT_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY:?Set the S3 access key}
      ROOT_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY:?Set the S3 secret key}
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - objects:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: [python, manage.py, pipeline_worker]
    environment:
      DATABASE_URL: postgresql://razpizi:${POSTGRES_PASSWORD}@postgres:5432/razpizi
      PIPELINE_REMOTE: "1"
      PIPELINE_S3_ENDPOINT: http://storage:9000
      PIPELINE_S3_BUCKET: ${PIPELINE_S3_BUCKET:-razpizi-documents}
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
      PIPELINE_MAX_DOWNLOAD: ${PIPELINE_MAX_DOWNLOAD:-8589934592}
      PIPELINE_MAX_EXPANDED: ${PIPELINE_MAX_EXPANDED:-34359738368}
      TMPDIR: /scratch
    volumes:
      - scratch:/scratch
    mem_limit: 2g
    cpus: 2
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    command: [python, manage.py, enqueue_pipeline, --watch]
    environment:
      DATABASE_URL: postgresql://razpizi:${POSTGRES_PASSWORD}@postgres:5432/razpizi
      PIPELINE_REMOTE: "1"
      PIPELINE_S3_ENDPOINT: http://storage:9000
      PIPELINE_S3_BUCKET: ${PIPELINE_S3_BUCKET:-razpizi-documents}
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    mem_limit: 256m
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique signing key in Coolify}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the public HTTPS origin}
      HOSTED_REQUIRE_LOGIN: "1"
      DJANGO_TRUST_PROXY_SSL: "1"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      SESSION_COOKIE_SECURE: "1"
      DATABASE_URL: postgresql://razpizi:${POSTGRES_PASSWORD}@postgres:5432/razpizi
      PIPELINE_REMOTE: "1"
      PIPELINE_S3_ENDPOINT: http://storage:9000
      PIPELINE_S3_BUCKET: ${PIPELINE_S3_BUCKET:-razpizi-documents}
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY:?Set the S3 access key}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY:?Set the S3 secret key}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      MEDIA_ROOT: /data/media
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      SUBMISSION_REVIEW_MODEL: ${SUBMISSION_REVIEW_MODEL:-openai/gpt-6.1-terra}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn radar.wsgi:application --bind 0.0.0.0:8000
        --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    volumes:
      - web-media:/data/media
    mem_limit: 1536m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  mailer:
    build:
      context: ./backend
    restart: unless-stopped
    command: [python, manage.py, send_notification_emails, --watch]
    environment:
      DATABASE_URL: postgresql://razpizi:${POSTGRES_PASSWORD}@postgres:5432/razpizi
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONFIG: nginx.coolify.conf
        VITE_POSTHOG_KEY: ${POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    restart: unless-stopped
    expose:
      - "80"
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  web-media:
  database:
  objects:
  scratch:
