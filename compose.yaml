services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-only-razpisni-radar-change-before-hosting}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PIPELINE_REMOTE: ${PIPELINE_REMOTE:-0}
      PIPELINE_S3_ENDPOINT: ${PIPELINE_S3_ENDPOINT:-}
      PIPELINE_S3_BUCKET: ${PIPELINE_S3_BUCKET:-razpizi-documents}
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY:-}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      SUBMISSION_REVIEW_MODEL: ${SUBMISSION_REVIEW_MODEL:-openai/gpt-6.1-terra}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AJPES_LP_API_KEY: ${AJPES_LP_API_KEY:-}
      AJPES_LP_API_BASE: ${AJPES_LP_API_BASE:-https://wwwa.ajpes.si}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
    volumes:
      - radar-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
  mailer:
    build: ./backend
    restart: unless-stopped
    command: [python, manage.py, send_notification_emails, --watch]
    environment:
      DATABASE_PATH: /data/db.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - radar-data:/data
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy
  pjn-sync:
    profiles: [sync]
    build: ./backend
    command: ["python", "manage.py", "sync_pjn", "--watch"]
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      DATABASE_URL: ${DATABASE_URL:-}
      PIPELINE_REMOTE: ${PIPELINE_REMOTE:-0}
    volumes:
      - radar-data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  radar-data:
