services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
    volumes:
      - radar-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/bootstrap', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy
  pjn-sync:
    profiles: [sync]
    build: ./backend
    command: ["python", "manage.py", "sync_pjn", "--watch"]
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - radar-data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  radar-data:
