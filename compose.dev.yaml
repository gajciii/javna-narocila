# Local PostgreSQL and private S3; Django, Vite and pipeline processes run on the host.
# Fixed development credentials deliberately ignore production variables in .env.
name: razpizi-local
services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: razpizi_local
      POSTGRES_USER: razpizi
      POSTGRES_PASSWORD: razpizi-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U razpizi -d razpizi_local"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  storage:
    image: ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    command: [--port, ":9000", posix, /data]
    environment:
      ROOT_ACCESS_KEY: razpizi-local
      ROOT_SECRET_KEY: razpizi-local-storage-only
    ports:
      - "127.0.0.1:9003:9000"
    volumes:
      - objects:/data

volumes:
  database:
  objects:
