# Run on the dedicated server. Supply a private --env-file; bind only to its tailnet IP.
name: razpizi-pipeline
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: razpizi
      POSTGRES_USER: razpizi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${PIPELINE_BIND_IP:?Set a private bind IP}:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U razpizi -d razpizi"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    restart: unless-stopped
    command: [--port, ":9000", posix, /data]
    environment:
      ROOT_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY:?Set S3 access key}
      ROOT_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY:?Set S3 secret key}
    ports:
      - "${PIPELINE_BIND_IP}:9002:9000"
    volumes:
      - objects:/data
  worker:
    build: ./backend
    image: razpizi-pipeline-worker
    restart: unless-stopped
    command: [python, manage.py, pipeline_worker]
    environment: &worker-env
      DATABASE_URL: postgresql://razpizi:${POSTGRES_PASSWORD}@postgres:5432/razpizi
      PIPELINE_REMOTE: "1"
      PIPELINE_S3_ENDPOINT: http://storage:9000
      PIPELINE_S3_BUCKET: razpizi-documents
      PIPELINE_S3_ACCESS_KEY: ${PIPELINE_S3_ACCESS_KEY}
      PIPELINE_S3_SECRET_KEY: ${PIPELINE_S3_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
      PIPELINE_MAX_DOWNLOAD: ${PIPELINE_MAX_DOWNLOAD:-8589934592}
      PIPELINE_MAX_EXPANDED: ${PIPELINE_MAX_EXPANDED:-34359738368}
      TMPDIR: /scratch
    volumes:
      - scratch:/scratch
    mem_limit: 4g
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
  scheduler:
    image: razpizi-pipeline-worker
    restart: unless-stopped
    command: [python, manage.py, enqueue_pipeline, --watch]
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [scheduled]
    init: true
volumes:
  database:
  objects:
  scratch:
